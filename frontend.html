<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OmniVoice — Voice Cloning</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --accent:#6c8cff; --txt:#e6e8ec; --muted:#8a90a0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width:760px; margin:40px auto; padding:0 16px; }
  h1 { font-size:22px; }
  .card { background:var(--card); padding:20px; border-radius:12px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, textarea, select { width:100%; padding:10px; border-radius:8px; border:1px solid #2a2e38;
    background:#0f1115; color:var(--txt); font-size:14px; }
  textarea { resize:vertical; min-height:80px; }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:8px;
    background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  .status { font-size:13px; color:var(--muted); margin-top:12px; white-space:pre-wrap; }
  audio { width:100%; margin-top:16px; }
  .toggle { display:flex; gap:8px; margin-bottom:8px; }
  .toggle button { margin:0; padding:8px; font-size:13px; background:#2a2e38; color:var(--txt); }
  .toggle button.active { background:var(--accent); }
  .warn { color:#ffb86c; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OmniVoice — Voice Cloning</h1>

  <div class="card">
    <div class="toggle">
      <button id="btnApi" class="active" onclick="setMode('api')">Via localhost:8000</button>
      <button id="btnRp" onclick="setMode('runpod')">Direct to RunPod</button>
    </div>
    <p class="warn" id="rpWarn" style="display:none">
      ⚠ Calling RunPod directly exposes your API key in the browser. Only use for local/dev.
    </p>

    <label>Target text (what to say)</label>
    <textarea id="target_text" placeholder="Enter the text to synthesize..."></textarea>

    <label>Reference text (what the ref voice says)</label>
    <textarea id="ref_text" placeholder="Welcome back to this another part of the video."></textarea>

    <label>Reference audio (optional — uses default if empty)</label>
    <input id="ref_audio" type="file" accept="audio/*" />

    <div class="row">
      <div>
        <label>Speed</label>
        <input id="speed" type="number" step="0.1" value="1.0" />
      </div>
      <div>
        <label>Num steps</label>
        <input id="num_step" type="number" value="32" />
      </div>
      <div>
        <label>Guidance</label>
        <input id="guidance_scale" type="number" step="0.1" value="2.0" />
      </div>
    </div>

    <div id="rpFields" style="display:none">
      <label>RunPod Endpoint ID</label>
      <input id="endpoint_id" value="g2r3qa341vtyyd" />
      <label>RunPod API Key</label>
      <input id="api_key" type="password" placeholder="rpa_..." />
    </div>

    <button id="go" onclick="submit()">Generate</button>
    <div class="status" id="status"></div>
    <audio id="player" controls style="display:none"></audio>
  </div>
</div>

<script>
let mode = "api";

function setMode(m) {
  mode = m;
  document.getElementById("btnApi").classList.toggle("active", m === "api");
  document.getElementById("btnRp").classList.toggle("active", m === "runpod");
  document.getElementById("rpFields").style.display = m === "runpod" ? "block" : "none";
  document.getElementById("rpWarn").style.display = m === "runpod" ? "block" : "none";
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(btoa(r.result.split(",")[1]));
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function submit() {
  const status = document.getElementById("status");
  const btn = document.getElementById("go");
  const player = document.getElementById("player");
  status.textContent = "Working…";
  btn.disabled = true;
  player.style.display = "none";

  const target_text = document.getElementById("target_text").value;
  const ref_text = document.getElementById("ref_text").value;
  const file = document.getElementById("ref_audio").files[0];
  const speed = parseFloat(document.getElementById("speed").value);
  const num_step = parseInt(document.getElementById("num_step").value);
  const guidance_scale = parseFloat(document.getElementById("guidance_scale").value);

  try {
    let audioBlobUrl;
    if (mode === "api") {
      const fd = new FormData();
      fd.append("target_text", target_text);
      fd.append("ref_text", ref_text);
      fd.append("speed", speed);
      fd.append("num_step", num_step);
      fd.append("guidance_scale", guidance_scale);
      if (file) fd.append("ref_audio", file);
      const resp = await fetch("http://localhost:8000/clone-voice", { method: "POST", body: fd });
      if (!resp.ok) throw new Error(await resp.text());
      audioBlobUrl = URL.createObjectURL(await resp.blob());
    } else {
      const endpoint = document.getElementById("endpoint_id").value;
      const key = document.getElementById("api_key").value;
      const ref_audio = file ? await fileToBase64(file) : null;
      // For direct RunPod we need a ref audio; if none uploaded, fetch the default from backend.
      let ref_b64 = ref_audio;
      if (!ref_b64) {
        const d = await (await fetch("http://localhost:8000/clone-voice/base64", {
          method:"POST",
          body: new URLSearchParams({ target_text:"x", ref_text: ref_text || "x" })
        })).json().catch(() => ({}));
        // fallback: ask backend to encode its default wav
        const enc = await fetch("http://localhost:8000/default-ref-base64").then(r=>r.json()).catch(()=>({}));
        ref_b64 = enc.audio_base64;
      }
      const payload = {
        input: {
          ref_audio: ref_b64, ref_text: ref_text || "default", target_text,
          speed, num_step, guidance_scale, denoise: true
        }
      };
      // Try sync first, fall back to async polling on timeout.
      let result;
      try {
        const r = await fetch(`https://api.runpod.ai/v2/${endpoint}/runsync`, {
          method:"POST",
          headers:{ "Authorization":`Bearer ${key}`, "Content-Type":"application/json" },
          body: JSON.stringify(payload),
          signal: AbortSignal.timeout(95000)
        });
        result = await r.json();
      } catch (e) {
        // async path
        const sub = await fetch(`https://api.runpod.ai/v2/${endpoint}/run`, {
          method:"POST",
          headers:{ "Authorization":`Bearer ${key}`, "Content-Type":"application/json" },
          body: JSON.stringify(payload)
        });
        const { id } = await sub.json();
        while (true) {
          await new Promise(r => setTimeout(r, 3000));
          const s = await fetch(`https://api.runpod.ai/v2/${endpoint}/status/${id}`, {
            headers:{ "Authorization":`Bearer ${key}` }
          }).then(r=>r.json());
          if (s.status === "COMPLETED") { result = s; break; }
          if (["FAILED","CANCELLED"].includes(s.status)) throw new Error(JSON.stringify(s));
        }
      }
      const b64 = result.output?.audio_base64;
      if (!b64) throw new Error("No audio: " + JSON.stringify(result));
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      audioBlobUrl = URL.createObjectURL(new Blob([arr], { type:"audio/wav" }));
    }
    player.src = audioBlobUrl;
    player.style.display = "block";
    status.textContent = "✓ Done.";
  } catch (e) {
    status.textContent = "✗ Error: " + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
