name: Build and Push Docker Image

# Triggers: runs every time you push to main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub's fast server builds it, not your laptop

    steps:
      # Step 1: Download your code onto GitHub's server
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to Docker Hub using your secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build the Docker image and push to Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/omnivoice-worker:latest